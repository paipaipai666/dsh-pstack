name: CI

on:
  push:
    branches:
      - main
      - fork/main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout upstream pstack submodule
        run: git submodule update --init --depth 1 upstream/cursor-plugins

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm exec vp run typecheck

      - name: Build
        run: pnpm exec vp run build

      - name: Test and coverage
        run: pnpm exec vp test run --coverage

      - name: Test compiled bundled scripts
        run: pnpm exec vp run test:runtime

      - name: Generated tree is current
        run: pnpm exec vp run generate:check

      - name: Port audit lock and references
        run: |
          pnpm exec vpx port/scan.mjs --check-lock
          pnpm exec vpx port/scan.mjs --check port/audit.md

      - name: Compatibility tables are current
        run: pnpm exec vp run compatibility:check

      - name: Package tarball
        run: |
          mkdir -p artifacts
          pnpm pack --ignore-scripts --pack-destination artifacts

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pstack-tarball
          path: artifacts/*.tgz
          if-no-files-found: error

  install-smoke:
    name: Install smoke (Linux)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: dsh-pstack-tarball

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Install DSH CLI
        run: pnpm add -g @deepseek-ai/dsh@0.2.2-rc.1

      - name: Install fork into isolated DSH_HOME
        env:
          DSH_CLI: dsh
        run: node scripts/smoke-install.mjs ./*dsh-pstack-*.tgz

  windows-smoke:
    name: Check (Windows smoke)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout upstream pstack submodule
        run: git submodule update --init --depth 1 upstream/cursor-plugins

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm exec vp run typecheck

      - name: Build
        run: pnpm exec vp run build

      - name: Test
        run: pnpm exec vp test

      - name: Test compiled bundled scripts
        run: pnpm exec vp run test:runtime

      - name: Generated tree is current
        run: pnpm exec vp run generate:check
