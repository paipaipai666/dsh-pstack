name: Release

on:
  push:
    branches:
      - main
      - fork/main
    tags:
      - "v*"

# Publishes with npm trusted publishing (OIDC): no NPM_TOKEN is used.
# The trusted publisher on npmjs.com must point at this file (release.yml)
# in paipaipai666/dsh-pstack, and the first publish must succeed within 2 days
# of creating that configuration, otherwise it expires.
permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this commit needs a release
        id: check
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHOULD_RELEASE="false"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            SHOULD_RELEASE="true"
          elif ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            SHOULD_RELEASE="true"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, should_release=$SHOULD_RELEASE"

  release:
    name: Release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep the pinned pstack source available to the build. Authenticate the
      # fetch so anonymous submodule clones are not rate-limited (HTTP 429).
      - name: Sync upstream submodules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI
        run: pnpm run ci

      - name: Tag release commit
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Created and pushed tag v$VERSION"

      - name: Resolve npm dist-tag
        id: dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION="$VERSION"
          fi
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $VERSION"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            TAG="${PRERELEASE%%.*}"
          else
            TAG="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with dist-tag: $TAG"

      - name: Publish to npm
        # `prepublishOnly` in package.json runs `vp run build` here, before the
        # tarball is packed, so no separate build step is needed.
        # NODE_AUTH_TOKEN must be empty so the npm CLI does not fall back to a
        # (missing) token and skip OIDC. The registry is the default public one.
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          pnpm publish \
            --access public \
            --no-git-checks \
            --provenance \
            --tag "${{ steps.dist-tag.outputs.tag }}"

      # Runs only after a successful npm publish, so a failed publish no longer
      # leaves behind a GitHub Release for a version that never reached npm.
      - name: Generate GitHub Changelog
        run: pnpx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
