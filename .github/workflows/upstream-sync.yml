name: Upstream sync check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check upstream pstack and dsh-pstack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Ensure sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pstack-update --color 1D76DB --description "Upstream pstack update pending" --force
          gh label create auto-sync-running --color FBCA04 --description "pstack auto-sync running" --force
          gh label create auto-sync-done --color 0E8A16 --description "pstack auto-sync completed" --force
          gh label create auto-sync-failed --color D93F0B --description "pstack auto-sync failed" --force
          gh label create needs-human --color B60205 --description "Needs maintainer decision" --force

      - name: Compare upstream pstack
        id: pstack
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-upstream.mjs --github-output --no-fail

      - name: Open pstack sync issue
        id: pstack_issue
        if: steps.pstack.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          LATEST: ${{ steps.pstack.outputs.latest }}
          LATEST_COMMIT: ${{ steps.pstack.outputs.latest_commit }}
          CURRENT: ${{ steps.pstack.outputs.current }}
        run: |
          existing="$(gh issue list --state open --search 'Upstream pstack in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "An open upstream pstack issue already exists."
            gh issue edit "$existing" --add-label pstack-update
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$(cat <<EOF
          Upstream cursor/plugins pstack has a newer version.

          - Current generated pstack: \`${CURRENT}\`
          - Upstream pstack: \`${LATEST}\`
          - Upstream commit: \`${LATEST_COMMIT}\`

          Done means:

          - \`pstack/plugin.json\` reports \`${LATEST}\` and \`node port/generate.mjs --check\` is quiet.
          - \`pnpm run vps:check\` passes on the branch, and the packaged statechart scripts come from
            \`runtime/\` rather than the generated tree.
          - The draft PR body carries the recorded exit code and output of every verification command.

          Evidence to attach:

          - The \`vps:check\` summary line and any gate that had to be repaired.
          - The upstream commit range used for the sync.

          This issue is the sync queue item. The VPS auto-sync worker will pick it up, create a
          draft pull request, and report the result here. Review the upstream changes at
          https://github.com/cursor/plugins/commits/main/pstack.

          <!-- dsh-task {"current":"${CURRENT}","latest":"${LATEST}","commit":"${LATEST_COMMIT}"} -->
          EOF
          )"
          url="$(gh issue create \
            --title "Upstream pstack: ${LATEST}" \
            --assignee "$REPO_OWNER" \
            --label pstack-update \
            --body "$body")"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Close stale pstack sync issues
        if: steps.pstack.outputs.up_to_date == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.pstack.outputs.current }}
        run: |
          numbers="$(gh issue list --state open --label pstack-update --json number --jq '.[].number')"
          for number in $numbers; do
            gh issue comment "$number" --body "Local pstack is now \`${CURRENT}\`; this sync issue is no longer needed."
            gh issue close "$number"
          done

      - name: Compare upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-upstream.mjs --target=release --github-output --no-fail

      - name: Open sync issue
        if: steps.upstream.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          CURRENT: ${{ steps.upstream.outputs.current }}
        run: |
          existing="$(gh issue list --state open --search 'upstream release in:title' --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "An open upstream release issue already exists."
            exit 0
          fi
          gh issue create \
            --title "Upstream release: ${LATEST}" \
            --assignee "$REPO_OWNER" \
            --body "Upstream l246804/dsh-pstack has a newer release.

            - Current fork version: \`${CURRENT}\`
            - Upstream latest release: \`${LATEST}\`

            Done means: \`fork/main\` is rebased or merged onto the release, the pstack tree is
            regenerated, and CI is green on the resulting branch.

            Evidence to attach: the upstream tag or commit, the regenerated tree diff summary, and
            the CI run URL."
