          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: pstack-skill
            name: "@paipaipai666/dsh-pstack"
          - id: pstack-subagent
            name: "@paipaipai666/dsh-pstack/subagent"
            config:
              provider: spawn
              maxDepth: 2
          - id: readonly-policy
            name: "@paipaipai666/dsh-pstack/readonly"
