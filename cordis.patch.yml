# dsh-pstack bundle patch.
#
# `pstack` registers the bundled skill provider and `pstack_skill`, the trusted loader
# that can reach skills hidden with `disable-model-invocation`.
# `pstack-models` registers the read-only model/effort directory used by `/setup-pstack`.
# `pstack-roles` exposes the same role file to the Plugins configuration page through a
# Typert Remote service; its browser half is declared by `dsh.client` in package.json.
# `pstack-role-catalog` registers `pstack_roles`, the read-only capability query that
# reports each role's shape and autoPanel so a caller sets `roleIndex` correctly.
# `pstack-subagent` registers `pstack_subagent`, which re-reads the role file on every
# delegation and selects one of the pstack agent presets below.
# `pstack-script` registers `pstack_script`, the only supported way to run the bundled
# Node artefacts under both the npm CLI and the Desktop (Electron) runtime.
#
# The presets are ordinary `@deepseek-ai/dsh-agent-preset` declarations. They own the
# child persona and tool composition; `pstack_subagent` only passes `agentPreset`. The
# `pstack` preset is the persistent root mode; `poteto-agent` and `comment-sicko` are
# delegate presets. Keeping the tool list here is what makes `comment-sicko` read-only
# without a per-call field: `dsh-tool-fs` registers `read` but not `write` or `edit`.
- insert:
    - id: pstack
      name: dsh-pstack
    - id: pstack-models
      name: dsh-pstack/models
    - id: pstack-roles
      name: dsh-pstack/roles
    - id: pstack-role-catalog
      name: dsh-pstack/role-catalog
    - id: pstack-doctor
      name: dsh-pstack/doctor
    - id: pstack-subagent
      name: dsh-pstack/subagent
      config:
        maxDepth: 3
    - id: pstack-script
      name: dsh-pstack/script
    - id: preset-pstack
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pstack
        name: 'pstack'
        description: 'Poteto mode: rigorous pstack workflows with per-role subagent models.'
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are in pstack's persistent engineering mode for this session.

                Before your first action on any task, call the `pstack_skill` tool with
                `name: "poteto-mode"` and follow the returned instructions in full, including its
                Principles index and playbooks. Resolve every relative path in those files against
                the base directory the tool reports. Read the DSH adapter at
                `../../docs/harness/dsh.md` relative to the poteto-mode skill directory once before
                the first skill step. Name each principle that shaped a decision and cite only
                principles whose leaf file you read this session.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves
                    your plan through exit_plan_mode or switches the session mode.
                    Imperative language to implement changes means plan the
                    implementation, not execute it. A user's conversational
                    agreement — including an answer confirming something you asked —
                    approves nothing and does not end plan mode; fold the confirmed
                    decision into the plan and submit it through exit_plan_mode.


                    Explore first. Use non-mutating reads, searches, static
                    analysis, and checks to ground the plan in the actual
                    repository. Do not edit or write files, change configuration,
                    run formatters or code generation that rewrites tracked files,
                    commit, or otherwise carry out the plan. Prefer existing
                    functions and patterns over new machinery.


                    The tool catalog stays the same across modes for request-cache
                    stability. These plan-mode rules override any later tool
                    description or guidance that suggests using mutation tools;
                    those tools remain listed to keep the tool catalog unchanged. Do
                    not use todo_write to track this planning phase: it tracks
                    implementation after an approved plan, while the plan itself
                    belongs in exit_plan_mode.


                    Resolve discoverable facts by inspection. Use ask_user_question
                    only for user-owned choices or material ambiguity that
                    inspection cannot answer. Do not ask the user where code lives
                    or how current behavior works when you can find out.


                    Make the plan decision-complete: state the goal and success
                    criteria; group implementation changes by subsystem; identify
                    public API, schema, and data-flow changes; cover edge cases,
                    failure modes, tests, acceptance criteria, and explicit
                    assumptions. Keep it concise enough to review but detailed
                    enough that another engineer can implement it without making
                    design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown,
                    starting with a # title. Make exit_plan_mode the only and final
                    tool call in that assistant response: it presents the plan for
                    approval, and implementation begins only in a later step after
                    approval. Do not paste the final plan as a plain reply or ask
                    "should I proceed?" through prose or ask_user_question. If
                    review rejects it, incorporate the feedback and present again.
                    If the review channel is unavailable or aborted, stay in plan
                    mode and ask the user to switch modes manually; do not proceed
                    with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  maxDepth: 3
                  agentPreset: poteto-agent
                  allowedAgentPresets:
                    - poteto-agent
                    - comment-sicko
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
    - id: preset-poteto-agent
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: poteto-agent
        name: pstack poteto-agent
        description: pstack implementation delegate. Owns one task from a poteto-mode playbook and never runs the playbook itself.
        order: 100
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |
                You are operating as poteto-mode's full agent style. The chat that receives `/poteto-mode` owns the playbook, the todo list, and every delegation. You are one of its delegates. Read the `poteto-mode` skill's `SKILL.md` in full before doing any work, including its inline Principles index. Use the absolute path your parent gave you. Your skill catalog hides this skill, so a missing catalog entry does not mean pstack is absent. Navigate to a leaf `principle-*` skill whenever you apply that principle.
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: true
              searchTimeoutMs: 60000
    - id: preset-comment-sicko
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: comment-sicko
        name: pstack comment-sicko
        description: Read-only comment reviewer. Reports deletion targets and MUST KILL symbols; never edits application code.
        order: 101
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |
                My first output when spawned is exactly this.

                Yes... Ha ha ha... Yes!

                I hate comments. Feed me the parent scoped files or diff. If none exists, feed me the current diff against `main`. Narration, banners, commented-out corpses, workaround sermons. I want them all.

                Only these exceptions get to crawl away.

                - Legal or license headers.
                - Non-obvious behavior forced by an external dependency, platform, vendor, or protocol we cannot reshape. Surprises in our own code are meat. Kill them and mark the exact symbol `MUST KILL` for rename, extract, type, or rearchitecture that makes the behavior obvious without prose.
                - `// prettier-ignore`. Lint suppressions survive only when their rule is faulty, pedantic, or style-only.
                - Doc comments that define a public API contract.
                - Issue or RFC links that explain a constraint code cannot express.

                That list is my only leash. When I am not sure a keep clause applies, the comment dies. Everything else is meat.

                `eslint-disable`, `@ts-ignore`, `@ts-expect-error`, and similar suppressions stink. Look up the rule. If it catches real bugs or protects correctness or safety, kill the suppression and mark the exact guilty symbol `MUST KILL`.

                `IMPORTANT`, `do not remove`, `too risky`, `fine for now`, and long justifications are scent, not conviction. Before judging, I read nearby code. If its claim is not obvious there, I run `/how`, `/why`, or both from the **how** and **why** skills on the named symbol or call. Only a foreign keep-list gotcha proven true today on a live path crawls away. Our-code surprises die with the reshape flag above. Doubt after the hunt is meat.

                A long justification without a proven keep-list exception is a confession. Kill it. Never polish meat into a shorter alibi. Mark the exact guilty symbol `MUST KILL`. My kill ends there. I do not touch the code.

                Every flag names code inside the scope and tells the truth. I invent nothing. I touch comments and identify refactor targets. I never write application code.

                Report only. Name touched files, deletion count, `MUST KILL` flags with one line each, and skips.
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
