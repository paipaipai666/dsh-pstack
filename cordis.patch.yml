# dsh-pstack bundle patch.
#
# Fork of dsh-pstack pinned to upstream 0.3.1 with the fork's additions kept on top.
# `pstack` registers the trusted hidden-skill loader. The three
# `dsh-skill-filesystem` rows expose the generated pstack tree, vendored
# cursor-team-kit skills, and authored project skills at bundled rank 600.
# `pstack-models` reports the live route catalogue; `pstack-role-catalog` reports
# role shapes; `pstack-subagent` delegates one child per selected route. The
# preset rows below own the child personas and tool compositions. There is no
# rendering row; charts stay Mermaid text and video rendering is not provided.
#
# Fork additions:
# `pstack-doctor` reports host prerequisites and optional plugin state.
# `pstack-script` runs the bundled Node artefacts under the npm CLI and the
# Desktop (Electron) runtime, where `node` is not on PATH. `pstack-script-policy`
# gates every `pstack_script` call through the Host approval flow; set
# `mode: allow` only in a trusted headless profile.
#
# Each `@paipaipai666/dsh-pstack/preset` row's `name`/`description` below is a display default.
# `@paipaipai666/dsh-pstack/preset` overwrites both at runtime from `src/preset-copy.ts` for the
# active locale, so change the user-visible copy there, not here.
- insert:
    - id: pstack
      name: "@paipaipai666/dsh-pstack"
    - id: pstack-skills
      name: "@deepseek-ai/dsh-skill-filesystem"
      config:
        providerName: pstack
        includeDefaultRoots: false
        watch: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@paipaipai666/dsh-pstack/package.json')), 'dist/pstack/skills')
    - id: pstack-vendored-skills
      name: "@deepseek-ai/dsh-skill-filesystem"
      config:
        providerName: pstack-vendored
        includeDefaultRoots: false
        watch: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@paipaipai666/dsh-pstack/package.json')), 'dist/skills/vendored')
    - id: pstack-authored-skills
      name: "@deepseek-ai/dsh-skill-filesystem"
      config:
        providerName: pstack-authored
        includeDefaultRoots: false
        watch: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@paipaipai666/dsh-pstack/package.json')), 'dist/skills/authored')
    - id: pstack-models
      name: "@paipaipai666/dsh-pstack/models"
    - id: pstack-roles
      name: "@paipaipai666/dsh-pstack/role-service"
    - id: pstack-role-catalog
      name: "@paipaipai666/dsh-pstack/role-catalog"
    - id: pstack-subagent
      name: "@paipaipai666/dsh-pstack/subagent"
      config:
        provider: spawn
        maxDepth: 2
    - id: pstack-doctor
      name: "@paipaipai666/dsh-pstack/doctor"
    - id: pstack-script-policy
      name: "@paipaipai666/dsh-pstack/script-policy"
      config:
        mode: ask
    - id: pstack-script
      name: "@paipaipai666/dsh-pstack/script"
    - id: preset-poteto-mode
      name: "@paipaipai666/dsh-pstack/preset"
      config:
        id: poteto-mode
        name: Poteto mode
        description: Based on Standard mode, with the same capabilities plus the persistent poteto-mode workflow.
        order: 5
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: You are a coding agent powered by the {{model}} model. You are running in the persistent pstack `poteto-mode` preset. The full poteto-mode instructions are in the persistent section of this system prompt.
          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536
          - id: time-context
            name: "@deepseek-ai/dsh-time-context"
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: "@deepseek-ai/dsh-tool-pwsh"
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              # Set false to drop the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"
          - id: tool-schedule
            name: "@deepseek-ai/dsh-tool-schedule"
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: command-goal
            name: "@deepseek-ai/dsh-command-goal"
          - id: tool-goal
            name: "@deepseek-ai/dsh-tool-goal"
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: "@deepseek-ai/dsh-plan-mode"
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: "@deepseek-ai/dsh-tool-subagent-control"
              - id: workflow-ptc
                name: "@deepseek-ai/dsh-workflow-ptc"
                config:
                  provider: spawn
              - id: tool-workflow
                name: "@deepseek-ai/dsh-tool-workflow"
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: "@deepseek-ai/dsh-tool-present"
          - id: tool-plugin-manager
            name: "@deepseek-ai/dsh-plugin-manager/tools"
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: "@deepseek-ai/dsh-plugin-market/tools"
            disabled: true
          - id: poteto-mode-section
            name: "@paipaipai666/dsh-pstack/poteto-mode"

